<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanookFlix - Sign Up</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background: #1a1a1a; padding: 30px; border-radius: 8px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00a4dc; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #00a4dc; color: white; border: none; padding: 10px; margin-top: 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0082b2; }
    </style>
</head>
<body>
    <div class="signup-card">
        <h2>SanookFlix</h2>
        <form>
            <label>Username</label>
            <input type="text" placeholder="Enter your username" required>
            
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
            
            <label>Account Type</label>
            <select>
                <option value="kid">Kid (Restricted Content)</option>
                <option value="adult">Adult (Full Access)</option>
            </select>
            
            <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
