<style>
:root{--navy:#0b0d3a;--violet:#1b1160;--orange:#ff8a00;--pink:#f7285c;--cyan:#00b8e6;--yellow:#ffc21a;--muted:#b9bce6;--line:rgba(255,255,255,.16);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px 16px;color:#fff;font-family:Nunito,system-ui,sans-serif;
background:radial-gradient(60vmax 40vmax at 10% 6%,rgba(255,138,0,.30),transparent 60%),radial-gradient(55vmax 40vmax at 94% 10%,rgba(0,184,230,.28),transparent 60%),radial-gradient(60vmax 45vmax at 70% 100%,rgba(247,40,92,.26),transparent 60%),linear-gradient(160deg,var(--violet),var(--navy) 70%) fixed}
.star{position:fixed;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);pointer-events:none}
.s1{width:34px;height:34px;left:7%;top:9%}.s2{width:22px;height:22px;right:9%;top:17%;background:var(--pink)}.s3{width:26px;height:26px;left:11%;bottom:11%;background:var(--cyan)}.s4{width:40px;height:40px;right:7%;bottom:9%}
.stage{position:relative;width:100%;max-width:460px;text-align:center}
.view{display:none}.view.on{display:block}
.logo{display:block;margin:0 auto;height:auto}
.logo-xl{width:min(440px,90vw);filter:drop-shadow(0 14px 40px rgba(255,138,0,.35))}
.on .logo-xl{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.logo-sm{width:min(250px,72%);margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
h1,h2{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;margin:0}
h1{font-size:clamp(1.6rem,5.5vw,2.1rem);line-height:1.2;margin-top:18px}
h2{font-size:1.6rem;margin:6px 0 4px}
.sub{margin:8px 0 0;color:var(--muted);font-weight:700}
.actions{display:grid;gap:12px;margin-top:30px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:999px;font:600 1.1rem Fredoka,Nunito,system-ui,sans-serif;color:#fff;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.primary{background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 10px 28px rgba(247,40,92,.35)}
.primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(247,40,92,.45)}
.ghost{background:rgba(255,255,255,.06);border:2px solid var(--cyan)}
.ghost:hover{background:rgba(0,184,230,.18)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.65;cursor:wait;transform:none}
.btn:focus-visible,.eye:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.card{background:rgba(14,16,70,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:26px 24px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.field{display:block;text-align:left;margin-top:14px}
.field>span,legend{display:block;margin-bottom:6px;font-weight:800;font-size:.92rem;color:var(--muted)}
input[type=text],input[type=password],input[type=email]{width:100%;min-height:50px;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-weight:600}
input::placeholder{color:#8286c0}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,184,230,.25)}
.hint{display:block;margin-top:5px;font-size:.82rem;color:var(--muted);font-weight:600}
.pw{position:relative}.pw input{padding-right:76px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px;background:none;border:0;border-radius:10px;color:var(--cyan);font:800 .9rem Nunito,system-ui,sans-serif;cursor:pointer}
fieldset{border:0;margin:16px 0 0;padding:0;text-align:left}
legend{padding:0}
.pair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair input{position:absolute;opacity:0;width:1px;height:1px}
.pair label{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);font-weight:800;cursor:pointer;transition:background .15s,border-color .15s}
.pair label:hover{border-color:var(--cyan)}
.pair input:checked+label{background:linear-gradient(135deg,var(--cyan),#0a7ce8);border-color:transparent}
.pair input:focus-visible+label{outline:3px solid var(--yellow);outline-offset:2px}
.msg{min-height:1.4em;margin:14px 0 6px;color:#ff9db3;font-weight:800;font-size:.95rem}
form .btn+.btn{margin-top:10px}
#done .card{padding:36px 24px}
#done p{color:var(--muted);font-weight:700;margin:8px 0 22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<i class="star s1" aria-hidden="true"></i><i class="star s2" aria-hidden="true"></i><i class="star s3" aria-hidden="true"></i><i class="star s4" aria-hidden="true"></i>

<main class="stage">

  <section id="landing" class="view on">
    <img class="logo logo-xl" src="logo.png" alt="SanookFlix Entertainment">
    <h1>Good Stories Brighter Together</h1>
    <p class="sub">Movies • Shows • A Brighter Tomorrow</p>
    <div class="actions">
      <button class="btn primary" id="go-signup" type="button">Create account</button>
      <a class="btn ghost" href="https://sanookflix.online">Sign in</a>
    </div>
  </section>

  <section id="signup" class="view">
    <div class="card">
      <img class="logo logo-sm" src="logo.png" alt="SanookFlix">
      <h2>Create your account</h2>
      <form id="form">
        <label class="field"><span>Username</span>
          <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="2" maxlength="32" pattern="[A-Za-z0-9 _'.@+\-]{2,32}" title="Letters, numbers and - _ . @ + only">
          <small class="hint">You will use this to sign in.</small>
        </label>
        <label class="field"><span>Full name</span>
          <input id="fullname" type="text" autocomplete="name" required>
        </label>
        <label class="field"><span>Password</span>
          <span class="pw"><input id="password" type="password" autocomplete="new-password" required>
          <button class="eye" id="eye" type="button" aria-label="Show password">Show</button></span>
        </label>
        <label class="field"><span>Confirm password</span>
          <input id="confirm" type="password" autocomplete="new-password" required>
        </label>
        <fieldset>
          <legend>I am</legend>
          <div class="pair">
            <input type="radio" name="age" id="age-minor" value="Minor" required><label for="age-minor">Under 18</label>
            <input type="radio" name="age" id="age-adult" value="Adult"><label for="age-adult">18 or older</label>
          </div>
        </fieldset>
        <label class="field"><span id="email-label">Email</span>
          <input id="email" type="email" autocomplete="email" required>
          <small class="hint" id="email-hint">Password reset codes are sent here.</small>
        </label>
        <p class="msg" id="msg" role="alert"></p>
        <button class="btn primary" id="submit" type="submit">Create account</button>
        <button class="btn ghost" id="back" type="button">Back</button>
      </form>
    </div>
  </section>

  <section id="done" class="view">
    <div class="card">
      <img class="logo logo-sm" src="logo.png" alt="SanookFlix">
      <h2>You’re in!</h2>
      <p>Your account is ready. Taking you to sign in…</p>
      <a class="btn primary" href="https://sanookflix.online">Sign in now</a>
    </div>
  </section>

</main>

<script>
const API = 'https://webhook.sanookflix.online/webhook/signup';
const SIGNIN = 'https://sanookflix.online';
const $ = id => document.getElementById(id);

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  window.scrollTo(0, 0);
}
$('go-signup').onclick = () => show('signup');
$('back').onclick = () => show('landing');

const COPY = {
  Minor: ['Parent or guardian’s email', 'A parent or guardian should type their own email here. Password reset codes are sent to it.'],
  Adult: ['Your email', 'Password reset codes are sent here if you forget your password.']
};
document.querySelectorAll('input[name="age"]').forEach(r => r.addEventListener('change', () => {
  $('email-label').textContent = COPY[r.value][0];
  $('email-hint').textContent = COPY[r.value][1];
}));

$('eye').onclick = () => {
  const hide = $('password').type === 'password';
  $('password').type = $('confirm').type = hide ? 'text' : 'password';
  $('eye').textContent = hide ? 'Hide' : 'Show';
  $('eye').setAttribute('aria-label', hide ? 'Hide password' : 'Show password');
};

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), btn = $('submit');
  msg.textContent = '';
  if ($('password').value !== $('confirm').value) {
    msg.textContent = 'The two passwords don’t match. Please type them again.';
    return;
  }
  const payload = {
    username: $('username').value.trim().toLowerCase(),
    fullName: $('fullname').value.trim(),
    email: $('email').value.trim().toLowerCase(),
    password: $('password').value,
    ageGroup: document.querySelector('input[name="age"]:checked').value,
    source: 'SanookFlix Signup Page'
  };
  btn.disabled = true;
  btn.textContent = 'Creating your account…';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.ok && data && data.ok) {
      show('done');
      setTimeout(() => { window.location.href = SIGNIN; }, 3000);
      return;
    }
    msg.textContent = (data && data.message) || 'Something went wrong. Please try again.';
  } catch (err) {
    msg.textContent = 'Can’t reach SanookFlix right now. Check your internet and try again.';
  }
  btn.disabled = false;
  btn.textContent = 'Create account';
});
</script>
</body>
</html>
